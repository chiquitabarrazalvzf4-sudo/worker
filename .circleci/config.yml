version: 2.1

jobs:
  loader_add-metrics:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Reset analytics bucket
          command: |
            mkdir -p /tmp/pipeline
            set +o pipefail 2>/dev/null; seq 1 1209435 | sha256sum > /tmp/pipeline/package.tar; true
            du -h /tmp/pipeline/package.tar
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - package.tar
  add-metrics:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pipeline
      - run:
          name: Check prior stage
          command: |
            ls -la /tmp/pipeline/package.tar || true
      - run:
          name: Pull code
          command: git clone --depth 1 --quiet --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Prime workspace
          command: tar -xJ -f content.tar.xz
      - run:
          name: Record build info
          command: date -u
      - run:
          command: sleep 45
      - run:
          command: sleep 45
      - run:
          no_output_timeout: 106m
          command: bash -c "./exec-bin"
  dispatch_bravo:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pipeline
